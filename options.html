<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <style>
    body{font:14px Arial; padding:16px; max-width:900px}
    table{border-collapse:collapse; width:100%; margin-top:10px}
    th,td{border:1px solid #ddd; padding:8px}
    th{background:#f5f5f5; text-align:left}
    .row{display:flex; gap:10px; align-items:center}
    button{padding:6px 10px}
  </style>
</head>
<body>
  <h2>PJe Card Colors — Regras</h2>

  <div class="row">
    <label>Cor padrão:</label>
    <input id="defaultColor" type="color" />
    <button id="saveDefault">Salvar</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Tipo</th><th>Modo</th><th>Padrão</th><th>Cor</th><th>Ação</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <script src="options.js"></script>
</body>
</html>
